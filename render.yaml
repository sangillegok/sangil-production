services:
  - type: web
    name: sangil-production
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sangil-production-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

databases:
  - name: sangil-production-db
    plan: basic-256mb
    databaseName: sangil_production
    user: sangil_prod